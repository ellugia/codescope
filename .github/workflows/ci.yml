name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure black-box bridge
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.cwd();
          const values = {
            BRIDGE_COMMAND: process.execPath,
            BRIDGE_ARGS_JSON: JSON.stringify([path.join(root, "tests", "blackbox-bridge-wrapper.mjs")]),
            BRIDGE_CWD: root,
            BRIDGE_SERVER_PATH: path.join(root, "src", "server.mjs"),
          };
          const contents = `${Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n")}\n`;
          fs.appendFileSync(process.env.GITHUB_ENV, contents, "utf8");

      - name: Run self-check
        run: node scripts/self-check.mjs

      - name: Run Node tests
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
